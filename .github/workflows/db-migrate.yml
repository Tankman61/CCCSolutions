name: db migrations

# Migrations are applied ONLY by this workflow — never by a developer running
# db:migrate against production. On a PR we prove the committed migrations apply
# to a fresh database, then run every test against it with the coverage gate; on
# merge to main we apply them to the hosted project.

on:
  pull_request:
    paths:
      - 'backend/src/**'
      - 'backend/test/**'
      - 'backend/vitest.config.ts'
      - 'backend/package.json'
      - 'backend/bun.lock'
      - 'backend/drizzle/**'
      - 'backend/drizzle.config.ts'
      - 'backend/supabase/**'
      - '.github/workflows/db-migrate.yml'
  push:
    branches: [main]
    paths:
      - 'backend/drizzle/**'
      - 'backend/drizzle.config.ts'
      - '.github/workflows/db-migrate.yml'

defaults:
  run:
    working-directory: backend

jobs:
  # PRs: apply the committed migrations to a throwaway Supabase stack (which
  # provides the auth schema + roles our migration references), fail if
  # schema.ts was changed without generating a matching migration, then run
  # every test (unit + integration) against that stack with the coverage gate.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` resolves via the GitHub API and flakes on rate limits.
          version: 2.58.5
      - run: bun install --frozen-lockfile
      - name: Generate local JWT signing key (config.toml's signing_keys_path needs a file present)
        # NOT `supabase gen signing-key`: once signing_keys_path is set, every supabase
        # CLI call tries to READ that (missing-in-CI) file first and errors. Generate the
        # ES256 JWK directly with jose (already a dep) so the file exists before start.
        run: |
          bun -e '
            import { generateKeyPair, exportJWK } from "jose";
            import { writeFileSync } from "node:fs";
            import { randomUUID } from "node:crypto";
            const { privateKey } = await generateKeyPair("ES256", { extractable: true });
            const jwk = await exportJWK(privateKey);
            Object.assign(jwk, { kid: randomUUID(), use: "sig", alg: "ES256", key_ops: ["sign"], ext: true });
            writeFileSync("supabase/signing_keys.json", JSON.stringify([jwk]));
          '
      - name: Start local Supabase (Postgres + auth schema)
        run: supabase start
      - name: Apply migrations to the fresh database
        run: bun run db:migrate
        env:
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Fail if schema.ts has an un-generated migration (drift)
        run: |
          bun run db:generate
          # --porcelain, not `git diff`: a new migration is an UNTRACKED file, which
          # `git diff` does not report.
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::schema.ts changed but no migration was committed. Run 'bun run db:generate' and commit drizzle/."
            git status --porcelain -- drizzle
            exit 1
          fi
      - name: All tests with the coverage gate (unit + integration, against the stack above)
        # CI=true makes an unreachable DB fail the run instead of skipping every suite.
        run: bun run test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321

  # Merge to main: the ONLY place production is migrated. DIRECT_DATABASE_URL
  # lives only as a GitHub secret, never in a developer's .dev.vars, so prod
  # cannot be migrated by hand.
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    # Two merges landing close together must not migrate production concurrently.
    # Never cancel a run mid-migration.
    concurrency:
      group: db-migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply migrations to production
        run: bun run db:migrate
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
